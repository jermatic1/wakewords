[project]
name = "wakeword"
version = "0.1.0"
description = "Train custom microWakeWord models for ESPHome voice satellites"
readme = "README.md"
authors = [
    { name = "Jeremy", email = "155401269+jermatic1@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3,<4",
    "huggingface-hub>=0.30",
    "librosa>=0.10",
    "microwakeword",
    "mmap-ninja",
    "numpy>=2",
    "piper-tts==1.3.0",
    "pyyaml>=6",
    "soundfile>=0.12",
    "tensorboard",
    "torch>=2",
    "torchaudio",
    "tqdm",
]

[project.scripts]
wakeword = "wakeword.__main__:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv.sources]
microwakeword = { path = "external/micro-wake-word", editable = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["external/micro-wake-word"]
exclude = ["external", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
